name: Build Baron Launcher
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build launcher dashboard
        run: |
          npm install
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Test and build Java core
        run: gradle :launcher-core:clean :launcher-core:test :launcher-core:build
      - uses: actions/upload-artifact@v4
        with:
          name: baron-launcher-core-jar
          path: launcher-core/build/libs/*.jar
          if-no-files-found: error
