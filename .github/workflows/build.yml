name: Build Baron Launcher
on:
  push:
    branches: [main, electron-desktop-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: Test Java core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Test and build Java core
        run: gradle :launcher-core:clean :launcher-core:test :launcher-core:build
      - uses: actions/upload-artifact@v4
        with:
          name: baron-launcher-core-jar
          path: launcher-core/build/libs/*.jar
          if-no-files-found: error

  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: BARON-LAUNCHER-Windows-Setup
          path: release/*.exe
          if-no-files-found: error
